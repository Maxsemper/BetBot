<script type="module">
import { awayStats, isTriggered, annotate, collectTriggered, diffAgainstState, markExcluded, includedBooks } from '../scripts/rules.mjs';
import { buildMessage } from '../scripts/alerts/telegram.mjs';
import { appendSamples, computeTrend, attachTrends } from '../scripts/history.mjs';
import { unisciDoppioni } from '../scripts/providers/the-odds-api.mjs';
import { isItaliano } from '../docs/bookmakers.js';

const log = [];
let fails = 0;
function t(name, fn) {
  try { fn(); log.push('PASS  ' + name); }
  catch (e) { fails++; log.push('FAIL  ' + name + '\n        ' + e.message); }
}
function eq(a, b, msg) {
  const A = JSON.stringify(a), B = JSON.stringify(b);
  if (A !== B) throw new Error((msg ?? '') + ' atteso ' + B + ', ottenuto ' + A);
}
function ok(v, msg) { if (!v) throw new Error(msg ?? 'atteso true'); }

const CFG = { threshold: 1.85, alertMode: 'any' };
const mk = (id, home, away, prices) => ({
  id, home, away, commenceTime: '2026-09-01T18:00:00Z',
  books: prices.map((p, i) => ({ key: 'b' + i, title: 'Book ' + i, home: 3, draw: 3.3, away: p })),
});
const dataset = prices => ({ leagues: [{ key: 'k', label: 'Serie A', matches: prices }] });

t('awayStats calcola min/max/avg/count', () => {
  const s = awayStats(mk('1', 'A', 'B', [1.62, 1.70, 1.65]));
  eq(s.min, 1.62); eq(s.max, 1.70); eq(s.count, 3);
  ok(Math.abs(s.avg - 1.6566666) < 1e-5, 'media errata: ' + s.avg);
});

t('awayStats ignora quote non valide e restituisce null se vuoto', () => {
  eq(awayStats({ books: [{ away: null }, { away: 0 }, { away: 'x' }] }), null);
  eq(awayStats({ books: [] }), null);
});

t('modo any: basta un bookmaker sotto soglia', () => {
  ok(isTriggered({ min: 1.80, max: 1.95, avg: 1.88 }, CFG));
  ok(!isTriggered({ min: 1.86, max: 2.0, avg: 1.9 }, CFG));
});

t('soglia inclusiva: 1.85 esatto fa scattare', () => {
  ok(isTriggered({ min: 1.85, max: 1.85, avg: 1.85 }, CFG));
});

t('modo best: serve che anche la quota piu alta sia sotto soglia', () => {
  const cfg = { threshold: 1.85, alertMode: 'best' };
  ok(!isTriggered({ min: 1.80, max: 1.95, avg: 1.88 }, cfg));
  ok(isTriggered({ min: 1.70, max: 1.84, avg: 1.77 }, cfg));
});

t('modo average', () => {
  const cfg = { threshold: 1.85, alertMode: 'average' };
  ok(isTriggered({ min: 1.70, max: 1.95, avg: 1.82 }, cfg));
  ok(!isTriggered({ min: 1.70, max: 2.20, avg: 1.95 }, cfg));
});

t('annotate ordina i bookmaker per quota 2 crescente', () => {
  const d = dataset([mk('1', 'Lecce', 'Inter', [1.70, 1.62, 1.65])]);
  annotate(d, CFG);
  eq(d.leagues[0].matches[0].books.map(b => b.away), [1.62, 1.65, 1.70]);
  ok(d.leagues[0].matches[0].triggered);
});

t('partita senza quota 2 non scatta e non rompe', () => {
  const d = dataset([{ id: 'x', home: 'A', away: 'B', commenceTime: '2026-09-01T18:00:00Z', books: [] }]);
  annotate(d, CFG);
  eq(d.leagues[0].matches[0].triggered, false);
  eq(collectTriggered(d, CFG), []);
});

t('collectTriggered elenca solo i book sotto soglia', () => {
  const d = dataset([mk('1', 'Lecce', 'Inter', [1.62, 1.90, 1.80])]);
  annotate(d, CFG);
  const [a] = collectTriggered(d, CFG);
  eq(a.matchingBooks.map(b => b.away), [1.62, 1.80]);
  eq(a.minAway, 1.62); eq(a.bestAway, 1.90);
  eq(a.league, 'Serie A'); eq(a.away, 'Inter');
});

t('collectTriggered esclude le partite sopra soglia', () => {
  const d = dataset([mk('1', 'A', 'B', [2.30, 2.35]), mk('2', 'C', 'D', [1.44])]);
  annotate(d, CFG);
  eq(collectTriggered(d, CFG).map(a => a.id), ['2']);
});

t('dedup: alla seconda esecuzione identica non ci sono segnali nuovi', () => {
  const d = dataset([mk('1', 'Lecce', 'Inter', [1.62])]);
  annotate(d, CFG);
  const trig = collectTriggered(d, CFG);
  const r1 = diffAgainstState(trig, { active: {} });
  eq(r1.fresh.length, 1);
  const r2 = diffAgainstState(trig, { active: r1.nextActive });
  eq(r2.fresh.length, 0);
  eq(Object.keys(r2.nextActive), ['1']);
});

t('dedup: conserva triggeredAt originale tra i giri', () => {
  const prev = { active: { '1': { triggeredAt: '2020-01-01T00:00:00.000Z', commenceTime: 'x' } } };
  const r = diffAgainstState([{ id: '1', minAway: 1.6, commenceTime: 'x' }], prev);
  eq(r.nextActive['1'].triggeredAt, '2020-01-01T00:00:00.000Z');
});

t('dedup: una partita risalita sopra soglia puo ri-allertare dopo', () => {
  const trig = [{ id: '1', minAway: 1.6, commenceTime: 'x' }];
  const r1 = diffAgainstState(trig, { active: {} });
  const r2 = diffAgainstState([], { active: r1.nextActive });      // risale sopra soglia
  eq(Object.keys(r2.nextActive), []);
  const r3 = diffAgainstState(trig, { active: r2.nextActive });    // rientra
  eq(r3.fresh.length, 1);
});

t('buildMessage contiene squadre, quote e soglia', () => {
  const d = dataset([mk('1', 'Lecce', 'Inter', [1.62, 1.80])]);
  annotate(d, CFG);
  const msg = buildMessage(collectTriggered(d, CFG), 1.85, 'https://example.test/');
  ok(msg.includes('Inter'), 'manca la squadra ospite');
  ok(msg.includes('1.62'), 'manca la quota');
  ok(msg.includes('1.85'), 'manca la soglia');
  ok(msg.includes('1 segnale rilevato'), 'plurale errato: ' + msg.slice(0, 80));
  ok(msg.includes('https://example.test/'), 'manca il link');
});

t('buildMessage fa escape dell HTML nei nomi squadra', () => {
  const m = mk('1', '<b>Hack</b>', 'A & B', [1.50]);
  const d = dataset([m]);
  annotate(d, CFG);
  const msg = buildMessage(collectTriggered(d, CFG), 1.85, '');
  ok(msg.includes('&lt;b&gt;Hack&lt;/b&gt;'), 'nome casa non escapato');
  ok(msg.includes('A &amp; B'), 'nome ospite non escapato');
});

t('buildMessage usa il plurale con piu segnali', () => {
  const d = dataset([mk('1', 'A', 'B', [1.5]), mk('2', 'C', 'D', [1.4])]);
  annotate(d, CFG);
  const msg = buildMessage(collectTriggered(d, CFG), 1.85, '');
  ok(msg.includes('2 segnali rilevati'), 'plurale errato');
});


t('exchange escluso dal calcolo ma conservato nei dati', () => {
  const m = { id: '1', home: 'Fiorentina', away: 'Torino', commenceTime: 'x', books: [
    { key: 'betfair_ex_eu', title: 'Betfair', home: 2, draw: 3, away: 1.10 },
    { key: 'pinnacle', title: 'Pinnacle', home: 2, draw: 3, away: 5.01 },
  ] };
  const d = dataset([m]);
  annotate(d, CFG);
  eq(m.books.find(b => b.key === 'betfair_ex_eu').excluded, 'exchange');
  eq(m.awayStats.min, 5.01, 'lo stats deve ignorare exchange:');
  eq(m.triggered, false, 'non deve scattare:');
});

t('caso reale: Betfair 1.06 non fa piu scattare falsi allarmi', () => {
  const d = dataset([{ id: '1', home: 'AS Roma', away: 'Atalanta BC', commenceTime: 'x', books: [
    { key: 'betfair_ex_eu', title: 'Betfair', home: 2, draw: 3, away: 1.06 },
    { key: 'pinnacle', title: 'Pinnacle', home: 2.4, draw: 3.5, away: 3.10 },
    { key: 'betclic_fr', title: 'Betclic (FR)', home: 2.4, draw: 3.5, away: 3.50 },
  ] }]);
  annotate(d, CFG);
  eq(collectTriggered(d, CFG), []);
});

t('exchange riammesso se excludeExchanges = false', () => {
  const cfg = { threshold: 1.85, alertMode: 'any', excludeExchanges: false };
  const d = dataset([{ id: '1', home: 'A', away: 'B', commenceTime: 'x', books: [
    { key: 'betfair_ex_eu', title: 'Betfair', home: 2, draw: 3, away: 1.10 },
    { key: 'pinnacle', title: 'Pinnacle', home: 2, draw: 3, away: 5.01 },
  ] }]);
  annotate(d, cfg);
  eq(d.leagues[0].matches[0].triggered, true);
});

t('outlier scartato quando il campione e sufficiente', () => {
  const cfg = { threshold: 1.85, alertMode: 'any', maxDeviation: 1.30 };
  const d = dataset([mk('1', 'A', 'B', [1.20, 2.30, 2.35, 2.40, 2.45])]);
  annotate(d, cfg);
  const m = d.leagues[0].matches[0];
  eq(m.books.find(b => b.away === 1.20).excluded, 'outlier');
  eq(m.awayStats.min, 2.30);
  eq(m.triggered, false);
});

t('outlier NON applicato con campione troppo piccolo', () => {
  const cfg = { threshold: 1.85, alertMode: 'any', maxDeviation: 1.30 };
  const d = dataset([mk('1', 'A', 'B', [1.20, 2.40])]);
  annotate(d, cfg);
  eq(d.leagues[0].matches[0].books.every(b => !b.excluded), true, 'nessuna esclusione attesa:');
  eq(d.leagues[0].matches[0].triggered, true);
});

t('quote coerenti sotto soglia non vengono scartate come outlier', () => {
  const cfg = { threshold: 1.85, alertMode: 'any', maxDeviation: 1.30 };
  const d = dataset([mk('1', 'Lille', 'PSG', [1.65, 1.67, 1.68, 1.72, 1.78])]);
  annotate(d, cfg);
  const m = d.leagues[0].matches[0];
  eq(m.books.every(b => !b.excluded), true, 'nessuna esclusione attesa:');
  eq(m.triggered, true);
  eq(m.awayStats.count, 5);
});

t('annotate mette i bookmaker esclusi in fondo', () => {
  const d = dataset([{ id: '1', home: 'A', away: 'B', commenceTime: 'x', books: [
    { key: 'betfair_ex_eu', title: 'Betfair', home: 2, draw: 3, away: 1.10 },
    { key: 'pinnacle', title: 'Pinnacle', home: 2, draw: 3, away: 5.01 },
    { key: 'betclic_fr', title: 'Betclic', home: 2, draw: 3, away: 4.80 },
  ] }]);
  annotate(d, CFG);
  eq(d.leagues[0].matches[0].books.map(b => b.key), ['betclic_fr', 'pinnacle', 'betfair_ex_eu']);
});

t('collectTriggered riporta quanti book sono sotto soglia', () => {
  const d = dataset([mk('1', 'A', 'B', [1.62, 1.80, 2.10, 2.15])]);
  annotate(d, CFG);
  const [a] = collectTriggered(d, CFG);
  eq(a.booksUnderThreshold, 2);
  eq(a.bookCount, 4);
});

// --- storico e tendenza ---

const T0 = new Date('2026-08-26T00:00:00Z');
const T6 = new Date('2026-08-26T06:00:00Z');
const T12 = new Date('2026-08-26T12:00:00Z');
const KICK = '2026-08-30T18:45:00Z';
const KICK_LONTANO = '2027-01-01T18:45:00Z';
const withKick = (id, prices) => ({ id, home: 'A', away: 'B', commenceTime: KICK,
  books: prices.map((p, i) => ({ key: 'b' + i, title: 'Book ' + i, home: 3, draw: 3.3, away: p })) });
const run = (prev, prices, when) => {
  const d = dataset([withKick('1', prices)]);
  annotate(d, CFG);
  return { hist: appendSamples(prev, d, when), data: d };
};

t('primo giro: una rilevazione, nessuna tendenza', () => {
  const { hist } = run(null, [1.70, 1.72, 1.74], T0);
  eq(hist.series['1'].s.length, 1);
  eq(computeTrend(hist.series['1']), null);
});

t('secondo giro: la serie cresce e la tendenza compare', () => {
  const a = run(null, [1.70, 1.72, 1.74], T0).hist;
  const b = run(a, [1.60, 1.62, 1.64], T6).hist;
  eq(b.series['1'].s.length, 2);
  const tr = computeTrend(b.series['1']);
  eq(tr.direction, 'down');
  ok(tr.delta < 0, 'delta deve essere negativo: ' + tr.delta);
  eq(tr.samples, 2);
});

t('quota in salita', () => {
  const a = run(null, [1.60], T0).hist;
  const tr = computeTrend(run(a, [1.90], T6).hist.series['1']);
  eq(tr.direction, 'up');
  ok(tr.delta > 0);
});

t('variazione sotto soglia = stabile', () => {
  const a = run(null, [2.00], T0).hist;
  const tr = computeTrend(run(a, [2.01], T6).hist.series['1'], 1); // +0.5%
  eq(tr.direction, 'flat');
});

t('quote identiche non allungano la serie', () => {
  const a = run(null, [1.70, 1.72], T0).hist;
  const b = run(a, [1.70, 1.72], T6).hist;
  eq(b.series['1'].s.length, 1, 'la serie non deve crescere:');
  ok(b.series['1'].s[0][0] > a.series['1'].s[0][0], 'il timestamp deve aggiornarsi');
});

t('fromOpen si misura sulla prima rilevazione, non sulla precedente', () => {
  let h = run(null, [2.00], T0).hist;
  h = run(h, [1.90], T6).hist;
  h = run(h, [1.80], T12).hist;
  const tr = computeTrend(h.series['1']);
  ok(Math.abs(tr.delta - (-0.10)) < 1e-6, 'delta vs precedente: ' + tr.delta);
  ok(Math.abs(tr.fromOpen - (-0.20)) < 1e-6, 'fromOpen: ' + tr.fromOpen);
  eq(tr.open, 2);
});

t('le partite gia iniziate escono dallo storico', () => {
  const h = run(null, [1.70], T0).hist;
  ok(h.series['1'], 'presente prima');
  const dopo = appendSamples(h, { leagues: [] }, new Date('2026-08-30T23:00:00Z'));
  eq(Object.keys(dopo.series), [], 'deve essere svuotato dopo il fischio d\'inizio');
});

t('una partita non ancora iniziata resta anche se assente da un giro', () => {
  const h = run(null, [1.70], T0).hist;
  const dopo = appendSamples(h, { leagues: [] }, T6);
  ok(dopo.series['1'], 'non va scartata prima del kickoff');
});

t('la serie e limitata: non cresce senza fine', () => {
  let h = null;
  for (let i = 0; i < 60; i++) {
    const d = dataset([{ ...withKick('1', [1.50 + i * 0.01]), commenceTime: KICK_LONTANO }]);
    annotate(d, CFG);
    h = appendSamples(h, d, new Date(T0.getTime() + i * 6 * 3600e3));
  }
  ok(h.series['1'].s.length <= 48, 'lunghezza: ' + h.series['1'].s.length);
  ok(h.series['1'].s.length >= 40, 'troppo corta: ' + h.series['1'].s.length);
});

t('attachTrends popola match.trend', () => {
  const a = run(null, [1.70], T0);
  const b = run(a.hist, [1.60], T6);
  attachTrends(b.data, b.hist, 1);
  eq(b.data.leagues[0].matches[0].trend.direction, 'down');
});

t('la tendenza usa la media, non il minimo', () => {
  // Il minimo scende (1.70 -> 1.60) ma la media sale: deve risultare in salita.
  const a = run(null, [1.70, 1.80, 1.90], T0).hist;      // media 1.80
  const tr = computeTrend(run(a, [1.60, 2.10, 2.30], T6).hist.series['1']); // media 2.00
  eq(tr.direction, 'up');
});

t('il messaggio Telegram riporta la tendenza', () => {
  const a = run(null, [1.80], T0);
  const b = run(a.hist, [1.60], T6);
  attachTrends(b.data, b.hist, 1);
  const msg = buildMessage(collectTriggered(b.data, CFG), 1.85, '');
  ok(msg.includes('▼'), 'manca la freccia: ' + msg);
  ok(msg.includes('da 1.80'), 'manca la quota di apertura: ' + msg);
});

t('senza tendenza il messaggio non si rompe', () => {
  const a = run(null, [1.60], T0);
  attachTrends(a.data, a.hist, 1);
  const msg = buildMessage(collectTriggered(a.data, CFG), 1.85, '');
  ok(msg.includes('media'), 'il messaggio deve restare valido');
  ok(!msg.includes('▼') && !msg.includes('▲'), 'nessuna freccia attesa');
});

// --- doppioni di calendario nel feed quote -----------------------------------
// Quando i bookmaker non concordano sull'orario, il feed restituisce due eventi
// separati per la stessa partita, spartendosi i bookmaker. Vanno riuniti.

const ev = (id, home, away, when, chiavi) => ({
  id, home, away, commenceTime: when,
  books: chiavi.map(k => ({ key: k, title: k, home: 4, draw: 3.5, away: 1.7, lastUpdate: '2026-09-01T00:00:00Z' })),
});

t('due eventi della stessa partita diventano uno solo', () => {
  const out = unisciDoppioni([
    ev('aaa', 'Torino', 'AS Roma', '2026-09-13T10:30:00Z', ['pinnacle', 'betsson', 'nordicbet', 'marathonbet']),
    ev('bbb', 'Torino', 'AS Roma', '2026-09-14T16:30:00Z', ['unibet_fr', 'winamax_fr', 'betclic_fr', 'sport888', 'tipico_de']),
  ]);
  eq(out.length, 1);
  eq(out[0].books.length, 9, 'i bookmaker si sommano:');
  eq(out[0].variantiUnite, 2);
});

t('l orario e l id vengono dalla variante con piu bookmaker', () => {
  // Verificato su quattro casi reali con una fonte calendario indipendente:
  // la maggioranza dei bookmaker aveva sempre l'orario giusto.
  const out = unisciDoppioni([
    ev('aaa', 'Torino', 'AS Roma', '2026-09-13T10:30:00Z', ['pinnacle', 'betsson']),
    ev('bbb', 'Torino', 'AS Roma', '2026-09-14T16:30:00Z', ['unibet_fr', 'winamax_fr', 'betclic_fr']),
  ]);
  eq(out[0].commenceTime, '2026-09-14T16:30:00Z');
  eq(out[0].id, 'bbb', 'cosi l id resta stabile quando il feed si corregge:');
});

t('a parita di bookmaker la scelta resta deterministica', () => {
  const uno = unisciDoppioni([
    ev('bbb', 'A', 'B', '2026-09-13T10:00:00Z', ['x', 'y']),
    ev('aaa', 'A', 'B', '2026-09-14T10:00:00Z', ['z', 'w']),
  ]);
  const due = unisciDoppioni([
    ev('aaa', 'A', 'B', '2026-09-14T10:00:00Z', ['z', 'w']),
    ev('bbb', 'A', 'B', '2026-09-13T10:00:00Z', ['x', 'y']),
  ]);
  eq(uno[0].id, due[0].id, 'l ordine di arrivo non deve cambiare il risultato:');
});

t('lo stesso bookmaker in due varianti non viene contato due volte', () => {
  const a = ev('aaa', 'A', 'B', '2026-09-13T10:00:00Z', ['pinnacle']);
  const b = ev('bbb', 'A', 'B', '2026-09-14T10:00:00Z', ['pinnacle', 'unibet_fr']);
  a.books[0].away = 1.90; a.books[0].lastUpdate = '2026-09-02T00:00:00Z';  // piu' recente
  b.books[0].away = 1.70;
  const out = unisciDoppioni([a, b]);
  eq(out[0].books.length, 2);
  eq(out[0].books.find(x => x.key === 'pinnacle').away, 1.90, 'vince la quotazione piu recente:');
});

t('partite diverse non vengono unite', () => {
  eq(unisciDoppioni([
    ev('a', 'Torino', 'AS Roma', '2026-09-14T16:30:00Z', ['x']),
    ev('b', 'Torino', 'Juventus', '2026-09-14T16:30:00Z', ['y']),
    ev('c', 'AS Roma', 'Torino', '2026-09-14T16:30:00Z', ['z']),
  ]).length, 3, 'anche il ritorno e una partita diversa:');
});

t('lo stesso incontro a mesi di distanza resta doppio', () => {
  // Andata e ritorno hanno le stesse squadre nello stesso verso solo in
  // campionati diversi, ma la regola deve reggere comunque.
  eq(unisciDoppioni([
    ev('a', 'Torino', 'AS Roma', '2026-09-14T16:30:00Z', ['x']),
    ev('b', 'Torino', 'AS Roma', '2027-02-14T16:30:00Z', ['y']),
  ]).length, 2);
});

t('una partita senza doppioni passa intatta', () => {
  const solo = ev('a', 'Torino', 'AS Roma', '2026-09-14T16:30:00Z', ['x', 'y']);
  const out = unisciDoppioni([solo]);
  eq(out.length, 1);
  eq(out[0], solo, 'stesso oggetto, nessun campo aggiunto:');
});

t('tre varianti della stessa partita si uniscono tutte', () => {
  const out = unisciDoppioni([
    ev('a', 'A', 'B', '2026-09-12T10:00:00Z', ['x']),
    ev('b', 'A', 'B', '2026-09-13T10:00:00Z', ['y', 'z', 'w']),
    ev('c', 'A', 'B', '2026-09-14T10:00:00Z', ['v']),
  ]);
  eq(out.length, 1);
  eq(out[0].books.length, 5);
  eq(out[0].id, 'b');
  eq(out[0].variantiUnite, 3);
});

t('un bookmaker italiano ha la precedenza sulla maggioranza', () => {
  // Si gioca dall'Italia: se un sito italiano dice un orario, vale quello,
  // anche se e' in minoranza.
  const out = unisciDoppioni([
    ev('aaa', 'Torino', 'AS Roma', '2026-09-13T10:30:00Z', ['codere_it']),
    ev('bbb', 'Torino', 'AS Roma', '2026-09-14T16:30:00Z', ['unibet_fr', 'winamax_fr', 'betclic_fr', 'pinnacle']),
  ]);
  eq(out.length, 1);
  eq(out[0].commenceTime, '2026-09-13T10:30:00Z', 'vince l orario del book italiano:');
  eq(out[0].id, 'aaa');
  eq(out[0].orarioDecisoDa, 'bookmaker italiano');
  eq(out[0].books.length, 5, 'le quote restano comunque tutte:');
});

t('senza bookmaker italiani decide la maggioranza', () => {
  const out = unisciDoppioni([
    ev('aaa', 'Torino', 'AS Roma', '2026-09-13T10:30:00Z', ['pinnacle', 'betsson']),
    ev('bbb', 'Torino', 'AS Roma', '2026-09-14T16:30:00Z', ['unibet_fr', 'winamax_fr', 'betclic_fr']),
  ]);
  eq(out[0].commenceTime, '2026-09-14T16:30:00Z');
