<!doctype html><meta charset="utf-8"><title>test tracker</title><body><pre id="out">running…</pre>
<script type="module">
import {
  syncWithSignals, profitLoss, summarize, summarizeByLeague,
  hasUserData, isLocked, isPlayed, toCsv, parseBackup, newRow, RESULTS,
  computedProfitLoss, hasPlOverride, applyResults, equityCurve,
} from '../docs/tracker-core.js';

const log = [];
let fails = 0;
function t(name, fn) {
  try { fn(); log.push('PASS  ' + name); }
  catch (e) { fails++; log.push('FAIL  ' + name + '\n        ' + e.message); }
}
function eq(a, b, msg) {
  const A = JSON.stringify(a), B = JSON.stringify(b);
  if (A !== B) throw new Error((msg ?? '') + ' atteso ' + B + ', ottenuto ' + A);
}
function ok(v, msg) { if (!v) throw new Error(msg ?? 'atteso true'); }
function close(a, b, msg) {
  if (Math.abs(a - b) > 1e-9) throw new Error((msg ?? '') + ' atteso ' + b + ', ottenuto ' + a);
}

const NOW = new Date('2026-08-26T12:00:00Z');
const FUTURO = '2026-08-30T18:45:00Z';
const PASSATO = '2026-08-25T18:45:00Z';

const match = (id, home, away, when = FUTURO, min = 1.60, max = 1.75) => ({
  id, home, away, commenceTime: when, triggered: true,
  awayStats: { min, max, avg: (min + max) / 2, count: 20 },
});
const feed = (...matches) => ({ leagues: [{ key: 'k', label: 'Serie A', matches }] });
const vuoto = { leagues: [{ key: 'k', label: 'Serie A', matches: [] }] };

// --- ingresso e uscita automatica -------------------------------------------

t('un segnale nuovo entra da solo nel tracker', () => {
  const { rows, added } = syncWithSignals([], feed(match('1', 'Cagliari', 'Inter')), NOW);
  eq(rows.length, 1);
  eq(added.length, 1);
  eq(rows[0].away, 'Inter');
  eq(rows[0].source, 'auto');
  eq(rows[0].pinned, false);
});

t('la quota proposta e la migliore del mercato, il riferimento e la media', () => {
  const { rows } = syncWithSignals([], feed(match('1', 'A', 'B', FUTURO, 1.60, 1.75)), NOW);
  eq(rows[0].odds, 1.75, 'quota giocabile = la migliore:');
  eq(rows[0].signalOdds, 1.675, 'riferimento = media dei bookmaker, non il minimo:');
});

t('una riga automatica esce se la partita non e piu sotto soglia', () => {
  const { rows: r1 } = syncWithSignals([], feed(match('1', 'A', 'B')), NOW);
  const { rows: r2, removed } = syncWithSignals(r1, vuoto, NOW);
  eq(r2.length, 0);
  eq(removed.length, 1);
});

t('e rientra se la quota ci ridiscende', () => {
  const { rows: r1 } = syncWithSignals([], feed(match('1', 'A', 'B')), NOW);
  const { rows: r2 } = syncWithSignals(r1, vuoto, NOW);
  const { rows: r3, added } = syncWithSignals(r2, feed(match('1', 'A', 'B')), NOW);
  eq(r3.length, 1);
  eq(added.length, 1);
});

t('la quota di una riga automatica si aggiorna al variare del mercato', () => {
  const { rows: r1 } = syncWithSignals([], feed(match('1', 'A', 'B', FUTURO, 1.60, 1.75)), NOW);
  const { rows: r2 } = syncWithSignals(r1, feed(match('1', 'A', 'B', FUTURO, 1.40, 1.52)), NOW);
  eq(r2[0].odds, 1.52);
  eq(r2[0].signalOdds, 1.46, 'media di 1.40 e 1.52:');
});

// --- il pin, cioe' "finche' non la fisso io" ---------------------------------

t('una riga fissata resta anche quando il segnale sparisce', () => {
  const { rows: r1 } = syncWithSignals([], feed(match('1', 'A', 'B')), NOW);
  r1[0].pinned = true;
  const { rows: r2, removed } = syncWithSignals(r1, vuoto, NOW);
  eq(r2.length, 1);
  eq(removed.length, 0);
});

t('su una riga fissata il mercato non tocca la quota che hai inserito', () => {
  const { rows: r1 } = syncWithSignals([], feed(match('1', 'A', 'B', FUTURO, 1.60, 1.75)), NOW);
  r1[0].pinned = true;
  r1[0].odds = 1.90; // quota davvero ottenuta dal bookmaker
  const { rows: r2 } = syncWithSignals(r1, feed(match('1', 'A', 'B', FUTURO, 1.30, 1.35)), NOW);
  eq(r2[0].odds, 1.90, 'la quota inserita non va sovrascritta:');
  eq(r2[0].signalOdds, 1.325, 'il riferimento di mercato invece si aggiorna:');
});

t('uno stake inserito blocca la riga anche senza fissarla', () => {
  const { rows: r1 } = syncWithSignals([], feed(match('1', 'A', 'B')), NOW);
  r1[0].stake = 10;
  const { rows: r2 } = syncWithSignals(r1, vuoto, NOW);
  eq(r2.length, 1, 'una riga con soldi dentro non deve sparire:');
});

t('anche un esito o una nota bloccano la riga', () => {
  const base = () => syncWithSignals([], feed(match('1', 'A', 'B')), NOW).rows;
  const conEsito = base(); conEsito[0].result = RESULTS.WIN;
  eq(syncWithSignals(conEsito, vuoto, NOW).rows.length, 1, 'esito:');
  const conNota = base(); conNota[0].notes = 'giocata al bar';
  eq(syncWithSignals(conNota, vuoto, NOW).rows.length, 1, 'nota:');
});

t('note fatte di soli spazi non contano come dato', () => {
  eq(hasUserData({ notes: '   ' }), false);
  eq(hasUserData({ notes: 'x' }), true);
  eq(hasUserData({ stake: 0 }), true, 'stake 0 e comunque un dato inserito:');
  eq(hasUserData({}), false);
});

t('isLocked copre pin, dati e congelamento', () => {
  eq(isLocked({ pinned: true }), true);
  eq(isLocked({ frozen: true }), true);
  eq(isLocked({ stake: 5 }), true);
  eq(isLocked({ pinned: false, notes: '' }), false);
});

// --- congelamento al fischio d'inizio ----------------------------------------

t('al fischio d inizio la riga si congela e diventa storia', () => {
  const { rows: r1 } = syncWithSignals([], feed(match('1', 'A', 'B', FUTURO)), NOW);
  const dopo = new Date('2026-08-30T21:00:00Z');
  const { rows: r2, frozen } = syncWithSignals(r1, vuoto, dopo);
  eq(r2.length, 1, 'non deve sparire:');
  eq(r2[0].frozen, true);
  eq(frozen.length, 1);
});

t('una riga congelata non viene piu rimossa ne modificata dal mercato', () => {
  const congelata = { ...newRow(match('1', 'A', 'B', PASSATO), 'Serie A', { now: NOW }), frozen: true, odds: 1.9 };
  const { rows } = syncWithSignals([congelata], feed(match('1', 'A', 'B', PASSATO, 1.2, 1.3)), NOW);
  eq(rows.length, 1);
  eq(rows[0].odds, 1.9);
});

t('una partita gia iniziata non viene aggiunta da zero', () => {
  const { rows, added } = syncWithSignals([], feed(match('1', 'A', 'B', PASSATO)), NOW);
  eq(rows.length, 0);
  eq(added.length, 0);
});

t('le righe restano ordinate per data di inizio', () => {
  const { rows } = syncWithSignals([], feed(
    match('2', 'C', 'D', '2026-09-02T18:00:00Z'),
    match('1', 'A', 'B', '2026-08-28T18:00:00Z'),
    match('3', 'E', 'F', '2026-08-31T18:00:00Z'),
  ), NOW);
  eq(rows.map(r => r.id), ['1', '3', '2']);
});

t('le righe manuali non vengono mai rimosse dal sync', () => {
  const manuale = newRow({ id: 'man_1', home: 'A', away: 'B', commenceTime: FUTURO }, 'La Liga', { source: 'manual', now: NOW });
  eq(manuale.pinned, true, 'una riga manuale nasce fissata:');
  const { rows } = syncWithSignals([manuale], vuoto, NOW);
  eq(rows.length, 1);
});

// --- profitti ----------------------------------------------------------------

t('vincita: si guadagna lo stake per quota meno uno', () => {
  close(profitLoss({ stake: 10, odds: 1.75, result: RESULTS.WIN }), 7.5);
  close(profitLoss({ stake: 25, odds: 1.40, result: RESULTS.WIN }), 10);
});

t('sconfitta: si perde lo stake', () => {
  eq(profitLoss({ stake: 10, odds: 1.75, result: RESULTS.LOSE }), -10);
});

t('annullata: non si perde ne si guadagna', () => {
  eq(profitLoss({ stake: 10, odds: 1.75, result: RESULTS.VOID }), 0);
});

t('senza esito o senza stake il profitto non esiste ancora', () => {
  eq(profitLoss({ stake: 10, odds: 1.75, result: null }), null);
  eq(profitLoss({ stake: null, odds: 1.75, result: RESULTS.WIN }), null);
  eq(profitLoss({ stake: 10, odds: null, result: RESULTS.WIN }), null, 'vincita senza quota:');
});

t('una perdita si calcola anche senza quota registrata', () => {
  eq(profitLoss({ stake: 10, odds: null, result: RESULTS.LOSE }), -10);
});

// --- statistiche -------------------------------------------------------------

const registro = [
  { id: '1', league: 'Serie A', stake: 10, odds: 1.75, result: RESULTS.WIN },   // +7.50
  { id: '2', league: 'Serie A', stake: 10, odds: 1.60, result: RESULTS.LOSE },  // -10
  { id: '3', league: 'Ligue 1', stake: 20, odds: 1.50, result: RESULTS.WIN },   // +10
  { id: '4', league: 'Ligue 1', stake: 10, odds: 1.80, result: RESULTS.VOID },  //   0
  { id: '5', league: 'La Liga', stake: 10, odds: 1.70, result: null },          // in corso
  { id: '6', league: 'La Liga', stake: null, odds: 1.70, result: null },        // non giocata
];

t('il riepilogo conta solo le scommesse concluse', () => {
  const s = summarize(registro);
  eq(s.totali, 6);
  eq(s.giocate, 5, 'giocate = con stake:');
  eq(s.concluse, 4);
  eq(s.inCorso, 1);
  eq(s.vinte, 2); eq(s.perse, 1); eq(s.annullate, 1);
  close(s.profitLoss, 7.5);
  close(s.stake, 50);
  close(s.roi, 15);
});

t('il win rate ignora le annullate', () => {
  // 2 vinte, 1 persa, 1 annullata -> 2/3
  close(summarize(registro).winRate, (2 / 3) * 100);
});

t('un registro vuoto non produce divisioni per zero', () => {
  const s = summarize([]);
  eq(s.profitLoss, 0); eq(s.roi, null); eq(s.winRate, null); eq(s.quotaMedia, null);
});

t('le partite senza stake non entrano nelle statistiche', () => {
  eq(isPlayed({ stake: 10 }), true);
  eq(isPlayed({ stake: 0 }), false);
  eq(isPlayed({ stake: null }), false);
});

t('il riepilogo per campionato separa i tre campionati', () => {
  const per = summarizeByLeague(registro);
  eq(per.map(s => s.league), ['Ligue 1', 'Serie A', 'La Liga'],
    'ordinati per profitto, con i campionati senza esiti in fondo:');
  close(per.find(s => s.league === 'Serie A').profitLoss, -2.5);
  close(per.find(s => s.league === 'Ligue 1').profitLoss, 10);
});

// --- export e backup ---------------------------------------------------------

t('il CSV usa punto e virgola e virgola decimale, per Excel italiano', () => {
  const csv = toCsv([{ ...registro[0], home: 'Cagliari', away: 'Inter', commenceTime: FUTURO, notes: '' }]);
  const [head, riga] = csv.split('\r\n');
  eq(head.split(';')[0], 'Data');
  ok(riga.includes('Cagliari - Inter'), 'manca la partita: ' + riga);
  ok(riga.includes('1,75'), 'la quota deve avere la virgola: ' + riga);
  ok(riga.includes('7,5'), 'manca il profitto: ' + riga);
  ok(riga.includes('Vinta'), 'manca l esito: ' + riga);
});

t('le note con punto e virgola non spezzano il CSV', () => {
  const csv = toCsv([{ ...registro[0], home: 'A', away: 'B', commenceTime: FUTURO, notes: 'primo; secondo "x"' }]);
  const riga = csv.split('\r\n')[1];
  ok(riga.includes('"primo; secondo ""x"""'), 'note non protette: ' + riga);
});

t('il backup si rilegge e conserva i dati', () => {
  const originale = syncWithSignals([], feed(match('1', 'A', 'B')), NOW).rows;
  originale[0].stake = 15; originale[0].result = RESULTS.WIN; originale[0].notes = 'ok';
  const riletto = parseBackup(JSON.stringify({ rows: originale }));
  eq(riletto[0].stake, 15);
  eq(riletto[0].result, RESULTS.WIN);
  eq(riletto[0].notes, 'ok');
});

t('il backup accetta anche un elenco semplice', () => {
  eq(parseBackup(JSON.stringify([{ id: '1', home: 'A', away: 'B' }])).length, 1);
});

t('un backup malformato viene rifiutato invece di corrompere lo storico', () => {
  let errori = 0;
  for (const cattivo of ['{}', '"stringa"', '[{"id":1}]', '[{"home":"A"}]', 'non json']) {
    try { parseBackup(cattivo); } catch { errori++; }
  }
  eq(errori, 5, 'tutti e cinque devono essere rifiutati:');
});

t('un esito non riconosciuto nel backup viene azzerato, non importato', () => {
  const r = parseBackup(JSON.stringify([{ id: '1', home: 'A', away: 'B', result: 'boh' }]));
  eq(r[0].result, null);
});


// --- P/L corretto a mano (cashout) ------------------------------------------

t('il P/L manuale sostituisce il calcolo', () => {
  // Vinta a 1.75 con 10 di stake renderebbe +7.50, ma il cashout ha reso 3.
  const r = { stake: 10, odds: 1.75, result: RESULTS.WIN, plOverride: 3 };
  eq(computedProfitLoss(r), 7.5, 'il calcolo resta disponibile:');
  eq(profitLoss(r), 3, 'ma vince il valore inserito:');
  eq(hasPlOverride(r), true);
});

t('caso richiesto: vinta ma con P/L negativo', () => {
  const r = { stake: 10, odds: 1.75, result: RESULTS.WIN, plOverride: -4.50 };
  eq(profitLoss(r), -4.5);
  const s = summarize([r]);
  eq(s.vinte, 1, 'resta contata come vinta:');
  eq(s.perse, 0);
  close(s.winRate, 100, 'il win rate la considera vinta:');
  close(s.profitLoss, -4.5, 'ma il profitto e negativo:');
  close(s.roi, -45, 'e il ROI pure:');
});

t('un P/L manuale pari a zero conta come zero, non come assente', () => {
  const r = { stake: 10, odds: 1.75, result: RESULTS.WIN, plOverride: 0 };
  eq(hasPlOverride(r), true);
  eq(profitLoss(r), 0, 'zero e un valore, non "nessun valore"');
  eq(summarize([r]).profitLoss, 0);
});

t('svuotare il campo torna al calcolo automatico', () => {
  const r = { stake: 10, odds: 1.75, result: RESULTS.WIN, plOverride: null };
  eq(hasPlOverride(r), false);
  eq(profitLoss(r), 7.5);
});

t('il P/L manuale vale anche su una partita persa', () => {
  // Persa ma con cashout parziale: recuperati 4 dei 10.
  const r = { stake: 10, odds: 1.60, result: RESULTS.LOSE, plOverride: -6 };
  eq(profitLoss(r), -6);
  const s = summarize([r]);
  eq(s.perse, 1);
  close(s.profitLoss, -6);
});

t('un P/L manuale rende conclusa la riga anche senza esito', () => {
  const r = { stake: 10, odds: 1.75, result: null, plOverride: 2.5 };
  const s = summarize([r]);
  eq(s.concluse, 1, 'i soldi incassati contano comunque:');
  eq(s.inCorso, 0);
  close(s.profitLoss, 2.5);
  eq(s.winRate, null, 'senza esito non c e win rate:');
});

t('i totali mescolano righe calcolate e righe corrette a mano', () => {
  const righe = [
    { league: 'Serie A', stake: 10, odds: 1.75, result: RESULTS.WIN },                     // +7.50
    { league: 'Serie A', stake: 10, odds: 1.80, result: RESULTS.WIN, plOverride: -2 },     // -2.00 (cashout)
    { league: 'Serie A', stake: 20, odds: 1.50, result: RESULTS.LOSE },                    // -20.00
  ];
  const s = summarize(righe);
  close(s.profitLoss, -14.5, 'somma:');
  close(s.stake, 40);
  close(s.roi, -36.25);
  eq(s.vinte, 2); eq(s.perse, 1);
  close(s.winRate, (2 / 3) * 100);
  eq(s.conPlManuale, 1, 'quante righe sono corrette a mano:');
});

t('il riepilogo per campionato usa lo stesso P/L corretto', () => {
  const righe = [
    { league: 'Serie A', stake: 10, odds: 1.75, result: RESULTS.WIN, plOverride: -3 },
    { league: 'Ligue 1', stake: 10, odds: 1.75, result: RESULTS.WIN },
  ];
  const per = summarizeByLeague(righe);
  close(per.find(x => x.league === 'Serie A').profitLoss, -3);
  close(per.find(x => x.league === 'Ligue 1').profitLoss, 7.5);
  eq(per.map(x => x.league), ['Ligue 1', 'Serie A'], 'ordinati per profitto reale:');
});

t('un P/L manuale blocca la riga come ogni altro dato tuo', () => {
  const { rows: r1 } = syncWithSignals([], feed(match('1', 'A', 'B')), NOW);
  r1[0].plOverride = -5;
  eq(hasUserData(r1[0]), true);
  eq(syncWithSignals(r1, vuoto, NOW).rows.length, 1, 'non deve sparire:');
});

t('la compilazione automatica dell esito non tocca il P/L manuale', () => {
  const registro = { results: { x: { home: 'A', away: 'B', commenceTime: NOW.toISOString(),
    homeScore: 0, awayScore: 2, status: 'full_time', outcomeAway: 'win' } } };
  const { rows } = applyResults([{ id: 'x', result: null, stake: 10, odds: 1.75, plOverride: -3 }], registro);
  eq(rows[0].result, 'win', 'l esito si compila:');
  eq(rows[0].plOverride, -3, 'il P/L che hai messo tu resta:');
  eq(profitLoss(rows[0]), -3);
});

t('la quota media ignora le righe senza quota invece di contarle zero', () => {
  const righe = [
    { stake: 10, odds: 2.00, result: RESULTS.WIN },
    { stake: 10, odds: null, result: RESULTS.LOSE },   // persa senza quota registrata
  ];
  close(summarize(righe).quotaMedia, 2.00, 'due righe, una sola con quota:');
});

t('il backup conserva il P/L manuale e ignora valori non numerici', () => {
  const r = parseBackup(JSON.stringify([
    { id: '1', home: 'A', away: 'B', plOverride: -4.5 },
    { id: '2', home: 'C', away: 'D', plOverride: 'boh' },
  ]));
  eq(r[0].plOverride, -4.5);
  eq(r[1].plOverride, null);
});

t('il CSV segnala le righe con P/L corretto a mano', () => {
  const csv = toCsv([
    { home: 'A', away: 'B', commenceTime: FUTURO, league: 'Serie A', stake: 10, odds: 1.80, result: RESULTS.WIN, plOverride: -2, notes: '' },
    { home: 'C', away: 'D', commenceTime: FUTURO, league: 'Serie A', stake: 10, odds: 1.80, result: RESULTS.WIN, notes: '' },
  ]);
  const [head, conCashout, normale] = csv.split('\r\n');
  ok(head.includes('P/L manuale'), 'manca la colonna: ' + head);
  ok(conCashout.includes('-2;si;'), 'la riga con cashout deve essere marcata: ' + conCashout);
  ok(normale.includes('8;;'), 'la riga normale no: ' + normale);
});

// --- curva del profitto cumulato --------------------------------------------

const giocata = (giorno, stake, odds, result, extra = {}) => ({
  id: 'g' + giorno, league: 'Serie A', home: 'Casa', away: 'Ospite',
  commenceTime: `2026-09-${String(giorno).padStart(2, '0')}T18:00:00Z`,
  stake, odds, result, ...extra,
});

t('la curva somma progressivamente i profitti', () => {
  const c = equityCurve([
    giocata(1, 10, 1.75, RESULTS.WIN),   // +7.50 -> 7.50
    giocata(2, 10, 1.60, RESULTS.LOSE),  // -10   -> -2.50
    giocata(3, 20, 1.50, RESULTS.WIN),   // +10   ->  7.50
  ]);
  eq(c.map(p => p.cum), [7.5, -2.5, 7.5]);
  eq(c.map(p => p.pl), [7.5, -10, 10]);
});

t('la curva segue la data della partita, non l ordine di inserimento', () => {
  const c = equityCurve([
    giocata(9, 10, 2.00, RESULTS.WIN),   // +10
    giocata(2, 10, 1.50, RESULTS.LOSE),  // -10
  ]);
  eq(c.map(p => p.t.slice(8, 10)), ['02', '09'], 'ordinate per data:');
  eq(c.map(p => p.cum), [-10, 0]);
});

t('le scommesse ancora aperte non entrano nella curva', () => {
  const c = equityCurve([
    giocata(1, 10, 1.75, RESULTS.WIN),
    giocata(2, 10, 1.75, null),          // in corso
    giocata(3, null, 1.75, null),        // nemmeno giocata
  ]);
  eq(c.length, 1, 'solo la conclusa:');
  eq(c[0].cum, 7.5);
});

t('la curva usa il P/L corretto a mano, non il calcolo', () => {
  const c = equityCurve([
    giocata(1, 10, 1.80, RESULTS.WIN, { plOverride: -2 }),  // cashout
    giocata(2, 10, 1.80, RESULTS.WIN),                       // +8
  ]);
  eq(c.map(p => p.pl), [-2, 8]);
  eq(c.map(p => p.cum), [-2, 6]);
});

t('un registro senza giocate concluse produce una curva vuota', () => {
  eq(equityCurve([]), []);
  eq(equityCurve([giocata(1, 10, 1.75, null)]), []);
});

t('la curva porta con se cosa serve al tooltip', () => {
  const [p] = equityCurve([giocata(1, 10, 1.75, RESULTS.WIN)]);
  eq(p.home, 'Casa'); eq(p.away, 'Ospite');
  eq(p.league, 'Serie A'); eq(p.result, RESULTS.WIN);
  eq(p.stake, 10);
});

t('gli importi sono arrotondati al centesimo', () => {
  // 10 x (1.333 - 1) = 3.3299999... : non deve arrivare cosi' al grafico.
  const [p] = equityCurve([giocata(1, 10, 1.333, RESULTS.WIN)]);
  eq(p.pl, 3.33);
  eq(p.cum, 3.33);
});

t('una serie tutta in perdita resta coerente', () => {
  const c = equityCurve([
    giocata(1, 10, 1.75, RESULTS.LOSE),
    giocata(2, 15, 1.75, RESULTS.LOSE),
  ]);
  eq(c.map(p => p.cum), [-10, -25]);
});

t('le annullate compaiono nella curva senza spostarla', () => {
  const c = equityCurve([
    giocata(1, 10, 1.75, RESULTS.WIN),
    giocata(2, 10, 1.75, RESULTS.VOID),
    giocata(3, 10, 1.75, RESULTS.LOSE),
  ]);
  eq(c.map(p => p.cum), [7.5, 7.5, -2.5], 'la annullata lascia il totale dove sta:');
  eq(c.length, 3, 'ma resta visibile come punto:');
});
document.getElementById('out').textContent =
