name: Monitor quote

on:
  schedule:
    # Ogni 6 ore (UTC): 00:00, 06:00, 12:00, 18:00
    # -> 02:00, 08:00, 14:00, 20:00 ora italiana (ora legale).
    - cron: '0 */6 * * *'
  workflow_dispatch:        # esecuzione manuale dalla tab Actions
    inputs:
      threshold:
        description: 'Soglia quota "2"'
        required: false
        default: '1.80'
      alert_mode:
        description: 'average = media di mercato · any = un solo bookmaker · best = tutto il mercato'
        required: false
        default: 'average'

concurrency:
  group: monitor-quote
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Scarica quote e valuta la regola
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_THRESHOLD: ${{ inputs.threshold || '1.80' }}
          ALERT_MODE: ${{ inputs.alert_mode || 'average' }}
          ODDS_REGIONS: eu
        run: |
          export PAGE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          node scripts/fetch-odds.mjs

      - name: Pubblica i dati aggiornati
        if: always()
        run: |
          git config user.name  "odds-monitor[bot]"
          git config user.email "odds-monitor@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Nessuna variazione nei dati."
          else
            git commit -m "chore(data): aggiornamento quote $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
